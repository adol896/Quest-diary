<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guild Quest Board - Edit Edition</title>
    <style>
        body {
            background-color: #1a0f0a;
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
            font-family: 'Georgia', serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; overflow-x: hidden;
        }
        .board {
            background: #3e2716; border: 12px solid #2a1a0a; border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 120px rgba(0,0,0,0.6);
            width: 95%; max-width: 1100px; min-height: 550px;
            padding: 50px 30px; display: flex; flex-wrap: wrap;
            gap: 25px; justify-content: center; align-content: flex-start; position: relative;
        }
        .header-nav { width: 95%; max-width: 1100px; display: flex; justify-content: flex-start; margin-bottom: 10px; }
        .home-btn { background: rgba(255,255,255,0.1); border: 1px solid #d4af37; color: #d4af37; padding: 5px 15px; border-radius: 5px; cursor: pointer; text-decoration: none; font-size: 0.9em; }
        h1 { width: 100%; text-align: center; color: #d4af37; font-size: 3.2em; text-shadow: 4px 4px 2px #000; margin: 0 0 30px 0; letter-spacing: 8px; border-bottom: 2px double #d4af37; padding-bottom: 10px; }
        
        .paper {
            background: #fdf5e6; background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            color: #432; width: 220px; min-height: 180px; padding: 25px 15px;
            box-shadow: 8px 8px 20px rgba(0,0,0,0.6); position: relative;
            cursor: pointer; transition: transform 0.2s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-weight: bold; font-size: 1.2em;
        }
        .paper::before { content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 18px; height: 18px; background: radial-gradient(circle, #ff4d4d, #800000); border-radius: 50%; box-shadow: 0 3px 6px rgba(0,0,0,0.5); z-index: 5; }
        
        /* 削除ボタン（×） */
        .delete-btn {
            position: absolute; top: 5px; right: 8px; width: 25px; height: 25px;
            background: rgba(139, 0, 0, 0.1); color: #8b0000; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; transition: 0.2s; opacity: 0.3; z-index: 10;
        }
        .paper:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #8b0000; color: #fff; transform: scale(1.2); }

        .paper.completed::after { content: "CLEAR"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); border: 4px solid #8b0000; color: #8b0000; font-size: 2.5em; padding: 5px 15px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; font-family: 'Arial Black', sans-serif; opacity: 0.8; pointer-events: none; }
        
        #score-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; pointer-events: none; }
        #score-display { color: #ff0000; font-size: clamp(3rem, 15vw, 10rem); font-family: 'Impact', sans-serif; text-align: center; text-shadow: 4px 4px 0px #fff, -4px -4px 0px #fff, 4px -4px 0px #fff, -4px 4px 0px #fff, 0px 0px 50px #000; transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #score-overlay.show { display: flex; }
        #score-overlay.show #score-display { transform: scale(1); }
        
        .input-panel { margin-top: 40px; background: #2a1a0a; padding: 25px 40px; border: 3px solid #d4af37; border-radius: 15px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        input[type="text"] { background: #1a0f0a; border: 1px solid #5d4037; border-radius: 5px; color: #fdf5e6; padding: 12px 20px; min-width: 250px; font-size: 1.1em; outline: none; }
        .btn { border: none; color: #000; padding: 10px 25px; font-weight: bold; font-size: 1.1em; border-radius: 5px; cursor: pointer; }
        .post-btn { background: linear-gradient(to bottom, #d4af37, #b8860b); }
        .score-btn { background: linear-gradient(to bottom, #e74c3c, #c0392b); color: #fff; }
        
        /* 音声入力ボタンのデザイン */
        .voice-btn { background: linear-gradient(to bottom, #2ecc71, #27ae60); color: #fff; }
        .voice-btn.recording { background: linear-gradient(to bottom, #e67e22, #d35400); animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .days-left { position: absolute; bottom: 5px; right: 10px; font-size: 0.6em; color: #a68b6d; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="Index.html" class="home-btn">◀ Index.html に戻る</a>
    </div>

    <div id="score-overlay">
        <div id="score-display">SCORE: 0点!</div>
    </div>

    <div class="board" id="board">
        <h1>QUEST BOARD</h1>
    </div>

    <div class="input-panel">
        <input type="text" id="questInput" placeholder="新たな依頼を掲示せよ..." onkeypress="if(event.key==='Enter') addQuest()">
        <button class="btn voice-btn" id="voiceBtn" onclick="toggleVoiceInput()">🎙️ 音声入力</button>
        <button class="btn post-btn" onclick="addQuest()">掲示する</button>
        <button class="btn score-btn" onclick="calculateScore()">本日の採点</button>
    </div>

    <script>
        let quests = JSON.parse(localStorage.getItem('myGuildQuestsV6')) || [];
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- 音声入力 (Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                const input = document.getElementById('questInput');
                input.value = transcript;
                // 音声認識後に自動で掲示（投稿）
                addQuest();
            };

            recognition.onend = () => {
                isRecording = false;
                const voiceBtn = document.getElementById('voiceBtn');
                if (voiceBtn) {
                    voiceBtn.classList.remove('recording');
                    voiceBtn.innerText = '🎙️ 音声入力';
                }
            };

            recognition.onerror = (event) => {
                console.error('音声認識エラー:', event.error);
                isRecording = false;
                const voiceBtn = document.getElementById('voiceBtn');
                if (voiceBtn) {
                    voiceBtn.classList.remove('recording');
                    voiceBtn.innerText = '🎙️ 音声入力';
                }
            };
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert('お使いのブラウザは音声入力に対応していません。(Google Chrome / Safari / Edge 等をご利用ください)');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                    isRecording = true;
                    const voiceBtn = document.getElementById('voiceBtn');
                    voiceBtn.classList.add('recording');
                    voiceBtn.innerText = '🎙️ 聞き取り中...';
                } catch (e) {
                    console.error(e);
                }
            }
        }
        // ------------------------------------

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'post') {
                osc.type = 'square'; osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'clear') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(1760, now + 0.2);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'score') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.5);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'delete') { // 削除音：シュパッ
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '<h1>QUEST BOARD</h1>';
            const now = new Date().getTime();
            const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
            quests = quests.filter(q => (now - q.createdAt) < sevenDaysInMs);

            quests.forEach((q, index) => {
                const paper = document.createElement('div');
                paper.className = `paper ${q.completed ? 'completed' : ''}`;
                paper.style.transform = `rotate(${q.rotate}deg)`;
                
                // 削除用 × ボタン
                const del = document.createElement('div');
                del.className = 'delete-btn';
                del.innerHTML = '×';
                del.onclick = (e) => {
                    e.stopPropagation(); // 紙クリックのイベント（CLEAR）を防ぐ
                    deleteQuest(index);
                };
                
                const text = document.createElement('span');
                text.innerText = q.text;

                const timeLeft = sevenDaysInMs - (now - q.createdAt);
                const daysLeft = Math.ceil(timeLeft / (1000 * 60 * 60 * 24));
                const timeTag = document.createElement('span');
                timeTag.className = 'days-left';
                timeTag.innerText = `期限まで ${daysLeft}日`;
                
                paper.appendChild(del);
                paper.appendChild(text);
                paper.appendChild(timeTag);
                
                paper.onclick = () => toggleQuest(index);
                board.appendChild(paper);
            });
            localStorage.setItem('myGuildQuestsV6', JSON.stringify(quests));
        }

        function addQuest() {
            const input = document.getElementById('questInput');
            if (!input.value.trim()) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playSound('post');
            quests.push({
                text: input.value, completed: false,
                rotate: (Math.random() * 8 - 4).toFixed(2),
                createdAt: new Date().getTime()
            });
            input.value = ""; renderBoard();
        }

        function toggleQuest(index) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!quests[index].completed) playSound('clear');
            quests[index].completed = !quests[index].completed;
            renderBoard();
        }

        function deleteQuest(index) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playSound('delete');
            quests.splice(index, 1);
            renderBoard();
        }

        function calculateScore() {
            if (quests.length === 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const completedCount = quests.filter(q => q.completed).length;
            const score = Math.round((completedCount / quests.length) * 100);
            const overlay = document.getElementById('score-overlay');
            const display = document.getElementById('score-display');
            display.innerText = `SCORE: ${score}点!`;
            overlay.classList.add('show');
            playSound('score');
            setTimeout(() => overlay.classList.remove('show'), 3000);
        }

        renderBoard();
    </script>
</body>
</html>
