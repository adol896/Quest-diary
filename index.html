<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Night & Guild Quest</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&display=swap');
        
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; }

        /* ------------------
           共通 
           ------------------ */
        .hidden { display: none !important; }

        /* ------------------
           Index View (焚き火・日記)
           ------------------ */
        #index-view {
            margin: 0; padding: 0; overflow: hidden; font-family: 'Shippori Mincho', serif; 
            background-color: #010305; user-select: none;
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: grab; }
        
        #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; pointer-events: none; z-index: 10; overflow-y: auto; overflow-x: hidden; }
        .interactive { pointer-events: auto; }

        /* index - UIヘッダーコンテナ（重なり防止用Gridレイアウト） */
        .header-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            width: 100%;
            padding: 20px;
            gap: 15px;
            pointer-events: none;
        }
        .header-container > * { pointer-events: auto; }

        /* 左上：コントロールエリア */
        .top-left-area { 
            justify-self: start;
            background: rgba(10, 25, 50, 0.65); padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(150, 220, 255, 0.3); color: #fff; display: flex; flex-direction: column; gap: 10px; backdrop-filter: blur(12px); 
        }
        .file-actions { display: flex; gap: 12px; align-items: center; justify-content: center; }
        .file-label-btn, .file-save-btn { cursor: pointer; color: #38bdf8; font-weight: bold; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s; background: none; border: none; padding: 0; font-family: inherit; }
        .file-label-btn:hover, .file-save-btn:hover { color: #7dd3fc; text-shadow: 0 0 8px rgba(56, 189, 248, 0.6); }
        .index-file-input { display: none; }

        .slot-controls { display: flex; gap: 6px; justify-content: center; }
        .slot-btn { background: #1e293b; color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .slot-btn.active { background: #38bdf8; color: #0f172a; font-weight: bold; box-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }

        /* 上部中央：戻るボタン */
        .top-center-area { justify-self: center; align-self: start; }
        .switch-btn { background: rgba(15, 23, 42, 0.7); color: #94a3b8; border: 1px solid rgba(150, 220, 255, 0.2); padding: 8px 20px; border-radius: 20px; cursor: pointer; text-decoration: none; font-size: 0.9rem; transition: 0.3s; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 6px; }
        .switch-btn:hover { background: rgba(56, 189, 248, 0.2); color: #fff; border-color: rgba(56, 189, 248, 0.5); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }

        /* 右上：本を開くボタン＆音声入力ボタン */
        .top-right-area { justify-self: end; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; justify-content: flex-end; }
        
        .action-btn {
            background: rgba(15, 23, 42, 0.75);
            color: #f1f5f9;
            border: 1px solid rgba(217, 119, 6, 0.4);
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Shippori Mincho', serif;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .action-btn:hover {
            background: rgba(217, 119, 6, 0.25);
            border-color: rgba(251, 191, 36, 0.8);
            color: #fff;
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
        }
        .action-btn.recording {
            background: rgba(225, 29, 72, 0.3);
            border-color: #f43f5e;
            color: #ffe4e6;
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        /* 画面幅が狭い場合（例えば 850px 以下）の重なり防止レスポンシブデザイン */
        @media (max-width: 850px) {
            .header-container {
                grid-template-columns: 1fr; /* 1列にする */
                justify-items: center;
                gap: 15px;
                padding: 15px 10px;
            }
            .top-left-area, .top-center-area, .top-right-area {
                justify-self: center;
                width: 100%;
                max-width: 400px;
                align-items: center;
            }
            .top-left-area { align-items: center; }
            .top-right-area { justify-content: center; }
        }

        /* index - 中央モーダル：半透明ベージュの貼り紙・羊皮紙風ノート */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 18, 0.55);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .paper-note {
            position: relative;
            width: 90%;
            max-width: 680px;
            height: 75vh;
            max-height: 650px;
            background: linear-gradient(135deg, rgba(246, 238, 218, 0.92) 0%, rgba(235, 220, 190, 0.88) 100%);
            border: 1px solid rgba(180, 140, 90, 0.6);
            border-radius: 6px;
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.6),
                inset 0 0 40px rgba(180, 140, 90, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            padding: 30px 25px 25px 35px;
            display: flex;
            flex-direction: column;
            transform: scale(0.92) translateY(10px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: #2c1e11;
        }
        .modal-overlay.active .paper-note {
            transform: scale(1) translateY(0);
        }

        .paper-note::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(-1deg);
            width: 110px;
            height: 26px;
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(210, 190, 150, 0.5);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            backdrop-filter: blur(2px);
        }

        .paper-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed rgba(140, 100, 60, 0.3);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .paper-title { font-size: 1.25rem; font-weight: 700; color: #4a321a; display: flex; align-items: center; gap: 8px; letter-spacing: 0.05em; }
        .paper-status { font-size: 0.8rem; color: #785a3a; font-style: italic; }

        .paper-body { flex: 1; width: 100%; position: relative; display: flex; flex-direction: column; }
        #paper-textarea {
            width: 100%; height: 100%; background: transparent; border: none; outline: none; resize: none;
            font-family: 'Shippori Mincho', serif; font-size: 1.05rem; line-height: 1.8; color: #2d1d0f;
            padding: 5px 10px 5px 0; background-image: linear-gradient(transparent 95%, rgba(160, 120, 80, 0.15) 95%);
            background-size: 100% 1.8em; background-attachment: local; overflow-y: auto; box-sizing: border-box;
            white-space: pre-wrap; word-break: break-all;
        }
        #paper-textarea::-webkit-scrollbar { width: 6px; }
        #paper-textarea::-webkit-scrollbar-track { background: rgba(180, 150, 110, 0.15); border-radius: 3px; }
        #paper-textarea::-webkit-scrollbar-thumb { background: rgba(140, 100, 60, 0.4); border-radius: 3px; }
        #paper-textarea::-webkit-scrollbar-thumb:hover { background: rgba(120, 80, 40, 0.6); }

        .paper-footer { margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(160, 120, 80, 0.2); display: flex; justify-content: space-between; align-items: center; }
        .paper-footer-left { display: flex; align-items: center; gap: 12px; }

        .paper-save-btn { background: rgba(140, 100, 60, 0.15); color: #4a321a; border: 1px solid rgba(140, 100, 60, 0.4); padding: 6px 14px; border-radius: 14px; font-family: 'Shippori Mincho', serif; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; }
        .paper-save-btn:hover { background: rgba(140, 100, 60, 0.3); color: #2c1e11; border-color: rgba(140, 100, 60, 0.7); }

        .mic-indicator { font-size: 0.85rem; color: #be123c; display: flex; align-items: center; gap: 6px; font-weight: 600; visibility: hidden; }
        .mic-indicator.active { visibility: visible; }

        .close-book-btn { background: #4a321a; color: #fef3c7; border: none; padding: 8px 22px; border-radius: 18px; font-family: 'Shippori Mincho', serif; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
        .close-book-btn:hover { background: #6b4723; transform: translateY(-1px); box-shadow: 0 5px 12px rgba(0,0,0,0.3); }

        @media (max-width: 600px) {
            .paper-note { width: 94%; height: 80vh; padding: 20px 15px 15px 20px; }
            .action-btn { padding: 8px 14px; font-size: 0.8rem; }
            .paper-footer-left { flex-direction: column; align-items: flex-start; gap: 6px; }
        }


        /* ------------------
           Quest View (クエストボード)
           ------------------ */
        #quest-view {
            background-color: #1a0f0a;
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
            font-family: 'Georgia', serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px; overflow-y: auto; overflow-x: hidden;
            width: 100%; position: absolute; top: 0; left: 0; z-index: 5;
        }
        .board {
            background: #3e2716; border: 12px solid #2a1a0a; border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 120px rgba(0,0,0,0.6);
            width: 95%; max-width: 1100px; min-height: 550px;
            padding: 50px 30px; display: flex; flex-wrap: wrap;
            gap: 25px; justify-content: center; align-content: flex-start; position: relative;
        }
        .header-nav { width: 95%; max-width: 1100px; display: flex; justify-content: flex-start; margin-bottom: 10px; }
        .quest-home-btn { background: rgba(255,255,255,0.1); border: 1px solid #d4af37; color: #d4af37; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-size: 0.9em; transition: 0.3s; }
        .quest-home-btn:hover { background: rgba(212, 175, 55, 0.2); color: #fff; }
        #quest-view h1 { width: 100%; text-align: center; color: #d4af37; font-size: 3.2em; text-shadow: 4px 4px 2px #000; margin: 0 0 30px 0; letter-spacing: 8px; border-bottom: 2px double #d4af37; padding-bottom: 10px; }
        
        .paper {
            background: #fdf5e6; background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            color: #432; width: 220px; min-height: 180px; padding: 25px 15px;
            box-shadow: 8px 8px 20px rgba(0,0,0,0.6); position: relative;
            cursor: pointer; transition: transform 0.2s;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-weight: bold; font-size: 1.2em;
        }
        .paper::before { content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 18px; height: 18px; background: radial-gradient(circle, #ff4d4d, #800000); border-radius: 50%; box-shadow: 0 3px 6px rgba(0,0,0,0.5); z-index: 5; }
        
        .delete-btn {
            position: absolute; top: 5px; right: 8px; width: 25px; height: 25px;
            background: rgba(139, 0, 0, 0.1); color: #8b0000; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; transition: 0.2s; opacity: 0.3; z-index: 10;
        }
        .paper:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #8b0000; color: #fff; transform: scale(1.2); }

        .paper.completed::after { content: "CLEAR"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); border: 4px solid #8b0000; color: #8b0000; font-size: 2.5em; padding: 5px 15px; background: rgba(255, 255, 255, 0.1); border-radius: 8px; font-family: 'Arial Black', sans-serif; opacity: 0.8; pointer-events: none; }
        
        #score-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; pointer-events: none; }
        #score-display { color: #ff0000; font-size: clamp(3rem, 15vw, 10rem); font-family: 'Impact', sans-serif; text-align: center; text-shadow: 4px 4px 0px #fff, -4px -4px 0px #fff, 4px -4px 0px #fff, -4px 4px 0px #fff, 0px 0px 50px #000; transform: scale(0); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #score-overlay.show { display: flex; }
        #score-overlay.show #score-display { transform: scale(1); }
        
        .input-panel { margin-top: 40px; background: #2a1a0a; padding: 25px 40px; border: 3px solid #d4af37; border-radius: 15px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 50px;}
        #questInput { background: #1a0f0a; border: 1px solid #5d4037; border-radius: 5px; color: #fdf5e6; padding: 12px 20px; min-width: 250px; font-size: 1.1em; outline: none; }
        .btn { border: none; color: #000; padding: 10px 25px; font-weight: bold; font-size: 1.1em; border-radius: 5px; cursor: pointer; transition: 0.2s;}
        .post-btn { background: linear-gradient(to bottom, #d4af37, #b8860b); }
        .post-btn:hover { background: linear-gradient(to bottom, #f5d76e, #d4af37); }
        .score-btn { background: linear-gradient(to bottom, #e74c3c, #c0392b); color: #fff; }
        .score-btn:hover { background: linear-gradient(to bottom, #ff7979, #e74c3c); }
        
        .voice-btn { background: linear-gradient(to bottom, #2ecc71, #27ae60); color: #fff; }
        .voice-btn:hover { background: linear-gradient(to bottom, #58d68d, #2ecc71); }
        .voice-btn.recording { background: linear-gradient(to bottom, #e67e22, #d35400); animation: pulse-opacity 1s infinite; }
        
        @keyframes pulse-opacity {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .days-left { position: absolute; bottom: 5px; right: 10px; font-size: 0.6em; color: #a68b6d; }
    </style>
</head>
<body>

    <!-- ＝＝＝＝＝＝＝＝＝
         Index View (焚き火・日記)
         ＝＝＝＝＝＝＝＝＝ -->
    <div id="index-view">
        <div id="canvas-container"></div>

        <div id="ui-layer">
            <div class="header-container">
                <div class="top-left-area interactive">
                    <div class="file-actions">
                        <label class="file-label-btn">
                            📂 ファイル読込
                            <input type="file" id="fileInput" class="index-file-input" accept=".txt,.md,.log,.json">
                        </label>
                        <button class="file-save-btn" onclick="exportToFile()">
                            💾 ファイル保存
                        </button>
                    </div>
                    <div class="slot-controls">
                        <button class="slot-btn active" id="slot1-btn" onclick="switchSlot(1)">保存枠 1</button>
                        <button class="slot-btn" id="slot2-btn" onclick="switchSlot(2)">保存枠 2</button>
                    </div>
                </div>

                <div class="top-center-area">
                    <button class="switch-btn" onclick="switchView('quest')">📜 クエストボードへ</button>
                </div>

                <div class="top-right-area">
                    <button class="action-btn" id="voice-toggle-btn" onclick="toggleDiaryVoiceInput()">
                        🎤 音声入力
                    </button>
                    <button class="action-btn" onclick="openBookModal()">
                        📖 本を開く
                    </button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="paperModal" onclick="onOverlayClick(event)">
            <div class="paper-note" onclick="event.stopPropagation()">
                <div class="paper-header">
                    <div class="paper-title">
                        📜 今日の出来事・日記
                    </div>
                    <div class="paper-status" id="save-status-text">保存済み</div>
                </div>

                <div class="paper-body">
                    <textarea id="paper-textarea" placeholder="ここに今日の出来事やメモを入力するか、ファイル読み込み・音声入力を行ってください..."></textarea>
                </div>

                <div class="paper-footer">
                    <div class="paper-footer-left">
                        <button class="paper-save-btn" onclick="exportToFile()">
                            💾 ファイルに保存 (.txt)
                        </button>
                        <div class="mic-indicator" id="micIndicator">
                            <span style="display:inline-block; width:8px; height:8px; background:#e11d48; border-radius:50%;"></span>
                            音声聞き取り中...
                        </div>
                    </div>
                    <button class="close-book-btn" onclick="closeBookModal()">本を閉じる ✖</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ＝＝＝＝＝＝＝＝＝
         Quest View (クエストボード)
         ＝＝＝＝＝＝＝＝＝ -->
    <div id="quest-view" class="hidden">
        <div class="header-nav">
            <button class="quest-home-btn" onclick="switchView('index')">◀ 焚き火・日記へ戻る</button>
        </div>

        <div id="score-overlay">
            <div id="score-display">SCORE: 0点!</div>
        </div>

        <div class="board" id="board">
            <h1>QUEST BOARD</h1>
        </div>

        <div class="input-panel">
            <input type="text" id="questInput" placeholder="新たな依頼を掲示せよ..." onkeypress="if(event.key==='Enter') addQuest()">
            <button class="btn voice-btn" id="voiceBtn" onclick="toggleQuestVoiceInput()">🎙️ 音声入力</button>
            <button class="btn post-btn" onclick="addQuest()">掲示する</button>
            <button class="btn score-btn" onclick="calculateScore()">本日の採点</button>
        </div>
    </div>

    <script>
        /* =========================================================================
           View切り替え
           ========================================================================= */
        let isThreeJsActive = true;
        function switchView(viewName) {
            if (viewName === 'quest') {
                document.getElementById('index-view').classList.add('hidden');
                document.getElementById('quest-view').classList.remove('hidden');
                isThreeJsActive = false; // レンダリング停止
            } else {
                document.getElementById('quest-view').classList.add('hidden');
                document.getElementById('index-view').classList.remove('hidden');
                isThreeJsActive = true;  // レンダリング再開
                if (camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            }
        }

        /* =========================================================================
           [Index View] Three.js & 日記機能
           ========================================================================= */
        let scene, camera, renderer, fireParticles = [], fairies = [], jackMat, targetRotX = -0.15, targetRotY = 0, isMouseDown = false, prevMouse = { x: 0, y: 0 };
        let currentSlot = 1;

        // 日記用音声認識変数
        let diaryRecognition = null;
        let isDiaryRecording = false;
        let diarySessionBaseText = '';

        function createFaceTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#44ff44';
            const cx = 128; const cy = 256;
            ctx.beginPath(); ctx.moveTo(cx - 40, cy - 50); ctx.lineTo(cx - 10, cy + 5); ctx.lineTo(cx - 55, cy + 5); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx + 40, cy - 50); ctx.lineTo(cx + 55, cy + 5); ctx.lineTo(cx + 10, cy + 5); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx, cy + 15); ctx.lineTo(cx + 15, cy + 35); ctx.lineTo(cx - 15, cy + 35); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx - 70, cy + 50); ctx.lineTo(cx - 50, cy + 70); ctx.lineTo(cx - 30, cy + 55);
            ctx.lineTo(cx, cy + 80); ctx.lineTo(cx + 30, cy + 55); ctx.lineTo(cx + 50, cy + 70);
            ctx.lineTo(cx + 70, cy + 50); ctx.lineTo(cx + 55, cy + 90); ctx.lineTo(cx, cy + 100); ctx.lineTo(cx - 55, cy + 90); ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function createJack(x, z, ry) {
            const group = new THREE.Group();
            const geo = new THREE.SphereGeometry(0.65, 32, 32);
            const pos = geo.attributes.position;
            for(let i=0; i<pos.count; i++) {
                const px = pos.getX(i); const pz = pos.getZ(i);
                const angle = Math.atan2(pz, px); const offset = Math.cos(angle * 8) * 0.05;
                pos.setX(i, px + px*offset); pos.setZ(i, pz + pz*offset);
            }
            geo.computeVertexNormals(); geo.scale(1.1, 0.8, 1.1);
            group.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x3d1f05, roughness: 0.9 })));
            const faceTex = createFaceTexture();
            jackMat = new THREE.MeshStandardMaterial({ map: faceTex, transparent: true, emissive: new THREE.Color(0x22ff22), emissiveMap: faceTex, emissiveIntensity: 2.5 });
            group.add(new THREE.Mesh(geo.clone().scale(1.01, 1.01, 1.01), jackMat));
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.08, 0.25), new THREE.MeshStandardMaterial({ color: 0x051105 }));
            stem.position.y = 0.45; group.add(stem);
            group.position.set(x, -0.1, z); group.rotation.y = ry; scene.add(group);
        }

        function createTent(x, z, ry) {
            const group = new THREE.Group();
            const tent = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2, 4), new THREE.MeshStandardMaterial({ color: 0x4a5a6a, roughness: 0.8 }));
            tent.rotation.y = Math.PI/4; group.add(tent);
            const pole = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2, 0.05), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            pole.position.set(0, 0, 1); group.add(pole);
            group.position.set(x, 0.5, z); group.rotation.y = ry; scene.add(group);
        }

        let fireLight;
        function init3D() {
            scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x020818, 0.012);
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(0, 4, 14);
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setClearColor(0x010308);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            scene.add(new THREE.AmbientLight(0x2a3a5a, 2.0));
            const moonLight = new THREE.DirectionalLight(0xb0d0ff, 3.5); moonLight.position.set(-40, 70, -30); scene.add(moonLight);
            fireLight = new THREE.PointLight(0xff7722, 5, 15); fireLight.position.set(0, 0.8, 0); scene.add(fireLight);

            const gCanvas = document.createElement('canvas'); gCanvas.width=512; gCanvas.height=512;
            const gCtx = gCanvas.getContext('2d'); gCtx.fillStyle='#050a05'; gCtx.fillRect(0,0,512,512);
            for(let i=0; i<12000; i++) { gCtx.fillStyle=`rgba(15, ${35+Math.random()*25}, 25, 0.4)`; gCtx.fillRect(Math.random()*512, Math.random()*512, 1, 6); }
            const groundTex = new THREE.CanvasTexture(gCanvas); groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(20, 20);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
            ground.rotation.x = -Math.PI/2; ground.position.y = -0.5; scene.add(ground);

            for(let i=0; i<60; i++) {
                const s = 0.04 + Math.random() * 0.12; const stone = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 0), new THREE.MeshStandardMaterial({ color: 0x222222, flatShading: true }));
                const dist = 1.5 + Math.random() * 6; const ang = Math.random() * Math.PI * 2;
                stone.position.set(Math.cos(ang)*dist, -0.48, Math.sin(ang)*dist); stone.rotation.set(Math.random(), Math.random(), Math.random()); scene.add(stone);
            }

            const logMat = new THREE.MeshStandardMaterial({ color: 0x1a110a });
            for(let i=0; i<6; i++) { const log = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.2), logMat); log.rotation.z = Math.PI/2; log.rotation.y = (i * Math.PI)/3; log.position.y = -0.35; scene.add(log); }
            createJack(2.2, 1.8, -0.5); createTent(-8, -12, 0.4);

            for(let i=0; i<6; i++) {
                const p = new THREE.PointLight(0x88ffff, 1.5, 4);
                const spriteMat = new THREE.SpriteMaterial({ map: (function(){ const c = document.createElement('canvas'); c.width=64; c.height=64; const ctx = c.getContext('2d'); const g = ctx.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'white'); g.addColorStop(0.4,'rgba(0,255,255,0.5)'); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);})(), blending: THREE.AdditiveBlending });
                const sprite = new THREE.Sprite(spriteMat); sprite.scale.set(0.35, 0.35, 1); p.add(sprite);
                p.userData = { angle: Math.random() * Math.PI * 2, radius: 2.5 + Math.random() * 4, speed: 0.01 + Math.random() * 0.015, yOff: Math.random() * 5 };
                scene.add(p); fairies.push(p);
            }

            for(let i=0; i<150; i++) { const a=Math.random()*Math.PI*2; const d=15+Math.random()*50; 
                const group = new THREE.Group(); const h = 14 + Math.random()*12;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, h, 8), new THREE.MeshStandardMaterial({ color: 0x081018 })); trunk.position.y = h/2 - 0.5; group.add(trunk);
                for(let j=0; j<3; j++) { const leaves = new THREE.Mesh(new THREE.SphereGeometry(3.5+Math.random(), 6, 4), new THREE.MeshStandardMaterial({ color: 0x0a1a2a, flatShading: true, transparent: true, opacity: 0.85 })); leaves.position.y = h - (j*3) - 0.5; group.add(leaves); }
                group.position.set(Math.cos(a)*d, 0, Math.sin(a)*d); scene.add(group);
            }

            const fTex = (function(){ const c = document.createElement('canvas'); c.width=64; c.height=64; const ctx = c.getContext('2d'); const g = ctx.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'white'); g.addColorStop(0.2,'#ffaa00'); g.addColorStop(0.6,'#ff3300'); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);})();
            const fMat = new THREE.SpriteMaterial({ map: fTex, blending: THREE.AdditiveBlending, transparent: true });
            function resetP(p) { p.position.set((Math.random()-0.5)*0.3, -0.2, (Math.random()-0.5)*0.3); p.userData = { life: Math.random(), speed: 0.02 + Math.random()*0.04 }; }
            for(let i=0; i<70; i++) { const p = new THREE.Sprite(fMat.clone()); resetP(p); scene.add(p); fireParticles.push(p); }

            const onStart = (x, y, target) => { if (target.closest('.interactive') || target.closest('button') || target.closest('.switch-btn') || target.closest('.paper-note')) return; isMouseDown = true; prevMouse = { x, y }; };
            window.addEventListener('mousedown', e => onStart(e.clientX, e.clientY, e.target));
            window.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY, e.target), {passive: false});
            window.addEventListener('mouseup', () => isMouseDown = false);
            window.addEventListener('mousemove', e => {
                if(!isMouseDown || !isThreeJsActive) return;
                targetRotY -= (e.clientX - prevMouse.x)*0.004; targetRotX -= (e.clientY - prevMouse.y)*0.004;
                targetRotX = Math.max(-0.4, Math.min(0.2, targetRotX)); prevMouse = { x: e.clientX, y: e.clientY };
            });

            function animate() {
                requestAnimationFrame(animate);
                if (!isThreeJsActive) return;

                camera.rotation.y += (targetRotY - camera.rotation.y)*0.05; camera.rotation.x += (targetRotX - camera.rotation.x)*0.05;
                fireParticles.forEach(p => { p.position.y += p.userData.speed; p.userData.life -= 0.015; p.scale.set(p.userData.life*1.2, p.userData.life*3, 1); if(p.userData.life <= 0) resetP(p); });
                fireLight.intensity = 6 + Math.sin(Date.now()*0.008) * 2;
                if(jackMat) jackMat.emissiveIntensity = 2.5 + Math.sin(Date.now()*0.006) * 1.5;
                fairies.forEach(f => { f.userData.angle += f.userData.speed; f.position.x = Math.cos(f.userData.angle) * f.userData.radius; f.position.z = Math.sin(f.userData.angle) * f.userData.radius; f.position.y = 1.2 + Math.sin(Date.now() * 0.0015 + f.userData.yOff) * 1.0; });
                renderer.render(scene, camera);
            }
            animate();
        }

        const paperModal = document.getElementById('paperModal');
        const paperTextarea = document.getElementById('paper-textarea');
        const saveStatusText = document.getElementById('save-status-text');

        function openBookModal() { paperModal.classList.add('active'); }
        function closeBookModal() { paperModal.classList.remove('active'); if (isDiaryRecording) stopDiaryVoiceInput(); }
        function onOverlayClick(e) { if (e.target === paperModal) closeBookModal(); }
        function saveMemo() { localStorage.setItem('fireTextSlot' + currentSlot, paperTextarea.value); saveStatusText.innerText = "自動保存済み"; saveStatusText.style.color = "#785a3a"; }
        paperTextarea.oninput = () => { saveStatusText.innerText = "保存中..."; saveStatusText.style.color = "#d97706"; clearTimeout(paperTextarea.timeout); paperTextarea.timeout = setTimeout(saveMemo, 500); };
        function switchSlot(num) { currentSlot = num; document.querySelectorAll('.slot-btn').forEach((b, i) => b.classList.toggle('active', i === num - 1)); paperTextarea.value = localStorage.getItem('fireTextSlot' + num) || ""; saveStatusText.innerText = "保存枠 " + num + " 読み込み完了"; saveStatusText.style.color = "#785a3a"; }

        document.getElementById('fileInput').onchange = (e) => { const file = e.target.files[0]; if(file) { const reader = new FileReader(); reader.onload = (ev) => { paperTextarea.value = ev.target.result; saveMemo(); openBookModal(); }; reader.readAsText(file); } };
        function exportToFile() { const content = paperTextarea.value; if (!content) { alert("保存するテキストが入力されていません。"); return; } const blob = new Blob([content], { type: 'text/plain;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; const now = new Date(); const y = now.getFullYear(); const m = String(now.getMonth()+1).padStart(2,'0'); const d = String(now.getDate()).padStart(2,'0'); a.download = `diary_slot${currentSlot}_${y}${m}${d}.txt`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }

        function initDiaryVoiceRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) { alert("音声入力に非対応のブラウザです。"); return false; }
            diaryRecognition = new SpeechRec(); diaryRecognition.lang = 'ja-JP'; diaryRecognition.continuous = true; diaryRecognition.interimResults = false;
            diaryRecognition.onstart = () => { isDiaryRecording = true; diarySessionBaseText = paperTextarea.value; document.getElementById('voice-toggle-btn').classList.add('recording'); document.getElementById('voice-toggle-btn').innerHTML = '🔴 停止する'; document.getElementById('micIndicator').classList.add('active'); openBookModal(); };
            diaryRecognition.onresult = (e) => {
                let sessionTranscript = ''; for (let i = 0; i < e.results.length; ++i) { if (e.results[i].isFinal) sessionTranscript += e.results[i][0].transcript; }
                if (sessionTranscript !== '') {
                    // \n がそのままテキストとして出てしまっていた問題を修正（バックスラッシュのエスケープを解除）
                    const nl = diarySessionBaseText.length > 0 && !diarySessionBaseText.endsWith('\n'); 
                    paperTextarea.value = diarySessionBaseText + (nl ? '\n' : '') + sessionTranscript; 
                    saveMemo(); 
                    paperTextarea.scrollTop = paperTextarea.scrollHeight; 
                }
            };
            diaryRecognition.onerror = (e) => { console.error("日記音声認識エラー:", e.error); stopDiaryVoiceInput(); };
            diaryRecognition.onend = () => { if (isDiaryRecording) { try { diaryRecognition.start(); } catch(e){} } else stopDiaryVoiceInputUI(); };
            return true;
        }
        function toggleDiaryVoiceInput() { if (isDiaryRecording) stopDiaryVoiceInput(); else { if (!diaryRecognition) if(!initDiaryVoiceRecognition()) return; try{ diaryRecognition.start(); }catch(e){} } }
        function stopDiaryVoiceInput() { isDiaryRecording = false; if (diaryRecognition) try { diaryRecognition.stop(); } catch(e){} stopDiaryVoiceInputUI(); }
        function stopDiaryVoiceInputUI() { isDiaryRecording = false; document.getElementById('voice-toggle-btn').classList.remove('recording'); document.getElementById('voice-toggle-btn').innerHTML = '🎤 音声入力'; document.getElementById('micIndicator').classList.remove('active'); }


        /* =========================================================================
           [Quest View] ギルドクエストボード
           ========================================================================= */
        let quests = JSON.parse(localStorage.getItem('myGuildQuestsV6')) || [];
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let questRecognition = null;
        let isQuestRecording = false;

        const SpeechRecQuest = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecQuest) {
            questRecognition = new SpeechRecQuest();
            questRecognition.lang = 'ja-JP';
            questRecognition.interimResults = false;
            questRecognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('questInput').value = transcript;
                addQuest(); // 自動投稿
            };
            questRecognition.onend = () => {
                isQuestRecording = false;
                const vBtn = document.getElementById('voiceBtn');
                if (vBtn) { vBtn.classList.remove('recording'); vBtn.innerText = '🎙️ 音声入力'; }
            };
            questRecognition.onerror = (event) => {
                console.error('クエスト音声認識エラー:', event.error);
                isQuestRecording = false;
                const vBtn = document.getElementById('voiceBtn');
                if (vBtn) { vBtn.classList.remove('recording'); vBtn.innerText = '🎙️ 音声入力'; }
            };
        }

        function toggleQuestVoiceInput() {
            if (!questRecognition) { alert('お使いのブラウザは音声入力に対応していません。'); return; }
            if (isQuestRecording) {
                questRecognition.stop();
            } else {
                try {
                    questRecognition.start();
                    isQuestRecording = true;
                    const vBtn = document.getElementById('voiceBtn');
                    vBtn.classList.add('recording');
                    vBtn.innerText = '🎙️ 聞き取り中...';
                } catch (e) { console.error(e); }
            }
        }

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime;
            if (type === 'post') {
                osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'clear') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(880, now); osc.frequency.exponentialRampToValueAtTime(1760, now + 0.2);
                gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2); osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'score') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.5);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.5); osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'delete') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1);
            }
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '<h1>QUEST BOARD</h1>';
            const now = new Date().getTime(); const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000;
            quests = quests.filter(q => (now - q.createdAt) < sevenDaysInMs);

            quests.forEach((q, index) => {
                const paper = document.createElement('div');
                paper.className = `paper ${q.completed ? 'completed' : ''}`;
                paper.style.transform = `rotate(${q.rotate}deg)`;
                
                const del = document.createElement('div');
                del.className = 'delete-btn'; del.innerHTML = '×';
                del.onclick = (e) => { e.stopPropagation(); deleteQuest(index); };
                
                const text = document.createElement('span'); text.innerText = q.text;

                const timeLeft = sevenDaysInMs - (now - q.createdAt);
                const daysLeft = Math.ceil(timeLeft / (1000 * 60 * 60 * 24));
                const timeTag = document.createElement('span'); timeTag.className = 'days-left'; timeTag.innerText = `期限まで ${daysLeft}日`;
                
                paper.appendChild(del); paper.appendChild(text); paper.appendChild(timeTag);
                paper.onclick = () => toggleQuest(index);
                board.appendChild(paper);
            });
            localStorage.setItem('myGuildQuestsV6', JSON.stringify(quests));
        }

        function addQuest() {
            const input = document.getElementById('questInput');
            if (!input.value.trim()) return;
            playSound('post');
            quests.push({ text: input.value, completed: false, rotate: (Math.random() * 8 - 4).toFixed(2), createdAt: new Date().getTime() });
            input.value = ""; renderBoard();
        }

        function toggleQuest(index) {
            if (!quests[index].completed) playSound('clear');
            quests[index].completed = !quests[index].completed;
            renderBoard();
        }

        function deleteQuest(index) {
            playSound('delete');
            quests.splice(index, 1);
            renderBoard();
        }

        function calculateScore() {
            if (quests.length === 0) return;
            const completedCount = quests.filter(q => q.completed).length;
            const score = Math.round((completedCount / quests.length) * 100);
            const overlay = document.getElementById('score-overlay');
            const display = document.getElementById('score-display');
            display.innerText = `SCORE: ${score}点!`;
            overlay.classList.add('show'); playSound('score');
            setTimeout(() => overlay.classList.remove('show'), 3000);
        }

        window.onload = () => { 
            init3D(); 
            switchSlot(1);
            renderBoard();
        };

        window.onresize = () => { 
            if (isThreeJsActive && camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight; 
                camera.updateProjectionMatrix(); 
                renderer.setSize(window.innerWidth, window.innerHeight); 
            }
        };
    </script>
</body>
</html>
